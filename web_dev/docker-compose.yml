version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - C:/Users/Mitja/Documents/git/web_dev:/var/www/html
      - ./apache/vhosts.conf:/etc/apache2/sites-enabled/000-default.conf
    depends_on:
      - db

  db:
    image: mysql:8.0.43
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: my_database
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: